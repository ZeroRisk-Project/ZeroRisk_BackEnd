# 페이징 벤치마크 실행 전용 프로필. local과 함께 사용해야 함
# (--spring.profiles.active=local,benchmark) - DB_HOST/Redis 등 나머지 설정은
# application-local.properties 그대로 쓰고, 여기서는 스케줄러만 추가로 끈다.
#
# 모든 @Scheduled 클래스에 @ConditionalOnProperty(app.scheduling.enabled)가 걸려 있어서,
# 이 값이 false면 대회 상태 전환/주문 체결/알림 발송/랭킹 갱신 등 실제 운영 스케줄러가
# 전부 비활성화된다 - 벤치마크 중 실제 운영 동작이 섞여 들어가는 것을 방지.
app.scheduling.enabled=false
