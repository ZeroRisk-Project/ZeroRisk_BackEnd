# 서버 포트 (docker-compose에서 8081로 맞춰뒀음)
server.port=8081
server.tomcat.uri-encoding=UTF-8

# ===== Oracle XE 데이터베이스 =====
spring.datasource.url=jdbc:oracle:thin:@${DB_HOST}:1521/XEPDB1?oracle.jdbc.defaultNChar=true
spring.datasource.username=zerorisk
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# ===== Spring Batch (페이징 벤치마크 전용, benchmark 프로필에서만 실제 사용) =====
# Job이 앱 기동 시 자동 실행되는 걸 기본적으로 막아둠 - 평소 배포/실행엔 전혀 영향 없어야 함.
# 벤치마크 실행 시에만 BenchmarkRunner가 JobLauncher로 직접 트리거함.
spring.batch.job.enabled=false
# 임베디드 DB가 아니라 Oracle이라 배치 메타데이터 테이블(BATCH_JOB_INSTANCE 등)이
# 자동 생성 안 됨 - 명시적으로 초기화하도록 설정 (최초 1회만 실질적으로 테이블을 만듦).
spring.batch.jdbc.initialize-schema=always

# ===== Redis =====
spring.data.redis.host=redis
spring.data.redis.port=6379

# ===== JWT =====
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=1800000
jwt.refresh-token-expiration=604800000

# ===== Actuator (헬스체크) =====
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always

# ===== 로깅 =====
logging.level.org.hibernate.SQL=debug

# ===== 스케줄러 =====
# 기본값 1이면 배치 하나가 지연될 때 나머지 배치가 모두 밀린다
spring.task.scheduling.pool.size=5

# ===== KIS 종목 마스터 파일 (인증 불필요, 공개 정적 파일) =====
kis.stock-master.kospi-url=https://new.real.download.dws.co.kr/common/master/kospi_code.mst.zip
kis.stock-master.kosdaq-url=https://new.real.download.dws.co.kr/common/master/kosdaq_code.mst.zip

# ===== KIS OpenAPI =====
kis.base-url=https://openapivts.koreainvestment.com:29443
kis.app-key=${KIS_APP_KEY}
kis.app-secret=${KIS_APP_SECRET}

# ===== KIS 순위분석 API (거래량순위) =====
# 순위분석 계열 API는 모의투자에서 지원되지 않아 실전 도메인·앱키로만 조회할 수 있다.
# 값을 비워두면 위의 기본 설정을 그대로 사용하므로, 실전 자격 증명이 없는 환경에서도 기동에는 문제가 없다.
kis.ranking.base-url=${KIS_RANKING_BASE_URL:https://openapi.koreainvestment.com:9443}
kis.ranking.app-key=${KIS_RANKING_APP_KEY:}
kis.ranking.app-secret=${KIS_RANKING_APP_SECRET:}

# ===== KIS HTTP 타임아웃 / 커넥션 풀 =====
kis.http.connect-timeout=3s
kis.http.response-timeout=5s
kis.http.master-file-response-timeout=60s
kis.http.max-connections=50
kis.http.pending-acquire-timeout=5s
kis.http.max-idle-time=30s
kis.http.token-lock-timeout=3s

# ===== KIS 실시간 시세 WebSocket (모의투자) =====
kis.realtime.ws-url=ws://ops.koreainvestment.com:31000

# ===== OAuth2 =====
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.scope=openid,profile_nickname,account_email
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post

spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.jwk-set-uri=https://kauth.kakao.com/.well-known/jwks.json
spring.security.oauth2.client.provider.kakao.user-name-attribute=sub

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===== reCAPTCHA =====
recaptcha.secret-key=${RECAPTCHA_SECRET_KEY}

oauth2.success-redirect-url=http://52.78.187.143/oauth2/success

# ===== CORS =====
# 배포 환경에서는 CORS_ALLOWED_ORIGINS 환경변수로 실제 프론트 주소를 지정 (콤마로 여러 개 구분)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ===== 게시글/채팅 이미지 업로드 =====
# 게시글/채팅 이미지 업로드 저장 경로 (로컬 개발 환경은 별도 지정, 배포 서버는 EC2 실제 경로)
app.upload.image-dir=${IMAGE_UPLOAD_DIR:./uploads/images}
app.upload.max-file-size=5242880

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB